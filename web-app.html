<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#075E42" />
    <title>ConstruÁgil CAD</title>
    <link data-trunk rel="icon" href="assets/logo.svg" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1e1e1e; }
      canvas { display: block; }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #1e1e1e;
        color: #cfcfcf;
        font-family: system-ui, sans-serif;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #loading.hide { opacity: 0; pointer-events: none; }
      #loading .title { font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
      #loading .title span { color: #0AA54E; }
      #loading .sub { font-size: 12px; color: #777; }
      #loading .spinner {
        width: 46px;
        height: 46px;
        border: 4px solid #2e2e2e;
        border-top-color: #0AA54E;
        border-radius: 50%;
        animation: ocs-spin 0.9s linear infinite;
      }
      @keyframes ocs-spin { to { transform: rotate(360deg); } }
    </style>
    <link data-trunk rel="rust" data-bin="OpenCADStudio" />
    <link data-trunk rel="copy-dir" href="web/fonts" />
    <link data-trunk rel="copy-file" href="web/ocs-parse-worker.js" />
    <link data-trunk rel="copy-file" href="web/discussions.json" />
    <link data-trunk rel="copy-file" href="web/videos.json" />
    <link data-trunk rel="copy-file" href="web/locale-labels.json" />
    <link data-trunk rel="copy-file" href="assets/construagil-marca.png" />
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <img src="construagil-marca.png" alt="ConstruÁgil" style="width:min(420px,80vw)" />
      <div class="title"><span>CAD</span></div>
      <div class="sub">Carregando…</div>
    </div>
    <script>
      // ConstruÁgil: medidor de uso (aba CAD da Produtividade na BI). Só tempo e local —
      // nunca o desenho. Tempo ATIVO = aba visível com rato/teclado no último minuto.
      // Quem entra pelo card da BI traz um bilhete opaco no fragmento (#u=…), que é
      // apagado do endereço logo aqui; sem ele o uso conta como anónimo.
      (() => {
        const API = "https://bi.construagil.lu/api/uso?action=cad-ingest";
        const TICK = 15000, ENVIO = 60000, INATIVO = 60000;
        let bilhete = "";
        try {
          const m = /(?:^#|&)u=([^&]+)/.exec(location.hash);
          if (m) {
            bilhete = decodeURIComponent(m[1]);
            sessionStorage.setItem("cg-cad-u", bilhete);
            history.replaceState(null, "", location.pathname + location.search);
          } else {
            bilhete = sessionStorage.getItem("cg-cad-u") || "";
          }
        } catch {}
        const hoje = () => {
          const d = new Date();
          return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
        };
        let ultimo = Date.now(), ativo = 0, aberto = 0, dia = hoje();
        const marca = () => { ultimo = Date.now(); };
        for (const ev of ["pointerdown", "pointermove", "keydown", "wheel", "touchstart"])
          window.addEventListener(ev, marca, { capture: true, passive: true });
        const corpo = () => JSON.stringify({ u: bilhete, dia, active_ms: ativo, wall_ms: aberto });
        const enviar = (fim) => {
          if (!ativo && !aberto) return;
          const dados = corpo();
          const zera = () => { ativo = 0; aberto = 0; };
          if (fim && navigator.sendBeacon) {
            // text/plain: pedido «simples», sem preflight de CORS
            if (navigator.sendBeacon(API, new Blob([dados], { type: "text/plain" }))) zera();
            return;
          }
          fetch(API, { method: "POST", mode: "cors", keepalive: true, headers: { "Content-Type": "text/plain" }, body: dados })
            .then((r) => { if (r.ok) zera(); })
            .catch(() => {});
        };
        setInterval(() => {
          const d = hoje();
          if (d !== dia) { enviar(false); dia = d; }
          if (document.visibilityState !== "visible") return;
          aberto += TICK;
          if (Date.now() - ultimo < INATIVO) ativo += TICK;
        }, TICK);
        setInterval(() => enviar(false), ENVIO);
        document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") enviar(true); });
        window.addEventListener("pagehide", () => enviar(true));
      })();
    </script>
    <script>
      (() => {
        const splash = document.getElementById("loading");
        fetch("locale-labels.json").then(response => response.json()).then(labels => {
          let saved;
          try {
            saved = JSON.parse(localStorage.getItem("opencadstudio.settings"))?.settings?.language;
          } catch {}
          const preferred = navigator.languages?.length ? navigator.languages : [navigator.language];
          const requested = typeof saved === "string" && saved !== "system" ? [saved] : ["pt-BR"];
          const available = Object.keys(labels);
          let locale = "pt-BR";
          for (const candidate of requested) {
            try {
              const language = new Intl.Locale(candidate);
              const match = available.find(value => value.toLowerCase() === language.baseName.toLowerCase())
                || (language.language === "zh"
                  ? (language.maximize().script === "Hant" ? "zh-TW" : "zh-CN")
                  : available.find(value => value.startsWith(language.language + "-")));
              if (match) { locale = match; break; }
            } catch {}
          }
          document.title = labels[locale].title;
          document.documentElement.lang = locale;
          document.documentElement.dir = locale === "ar-SA" ? "rtl" : "ltr";
          const caption = splash?.querySelector(".sub");
          if (caption) caption.textContent = labels[locale].loading;
        }).catch(() => {});
        const done = () => {
          if (!splash) return;
          splash.classList.add("hide");
          setTimeout(() => splash.remove(), 450);
        };
        if (document.querySelector("canvas")) return done();
        const observer = new MutationObserver(() => {
          if (document.querySelector("canvas")) {
            observer.disconnect();
            done();
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
